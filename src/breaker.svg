<svg viewBox="0 0 60 24" xmlns="http://www.w3.org/2000/svg">
  <g id="state-open" class="ah-state">
    <line x1="0" y1="12" x2="15" y2="12" stroke="var(--ah-stroke-default)" stroke-width="1.5"/>
    <line x1="48" y1="12" x2="60" y2="12" stroke="var(--ah-stroke-default)" stroke-width="1.5"/>
    <line x1="15" y1="12" x2="45" y2="2" stroke="var(--ah-state-off)" stroke-width="2"/>
  </g>
  <g id="state-close" class="ah-state">
    <line x1="0" y1="12" x2="15" y2="12" stroke="var(--ah-stroke-default)" stroke-width="1.5"/>
    <line x1="48" y1="12" x2="60" y2="12" stroke="var(--ah-stroke-default)" stroke-width="1.5"/>
    <line x1="15" y1="12" x2="48" y2="12" stroke="var(--ah-state-on)" stroke-width="2"/>
  </g>
  <g id="state-fault" class="ah-state">
    <line x1="0" y1="12" x2="15" y2="12" stroke="var(--ah-stroke-default)" stroke-width="1.5"/>
    <line x1="48" y1="12" x2="60" y2="12" stroke="var(--ah-stroke-default)" stroke-width="1.5"/>
    <line x1="15" y1="12" x2="48" y2="12" stroke="var(--ah-state-fault)" stroke-width="2"/>
    <line x1="45" y1="8" x2="51" y2="16" stroke="var(--ah-state-fault)" stroke-width="1.5"/>
    <line x1="51" y1="8" x2="45" y2="16" stroke="var(--ah-state-fault)" stroke-width="1.5"/>
  </g>
  <circle class="ah-port" data-port="in" cx="0" cy="12" r="2" fill="none" stroke="var(--ah-stroke-default)"/>
  <circle class="ah-port" data-port="out" cx="60" cy="12" r="2" fill="none" stroke="var(--ah-stroke-default)"/>
  <text class="ah-label" x="30" y="22" text-anchor="middle" font-size="4" fill="var(--ah-font-1)"></text>
